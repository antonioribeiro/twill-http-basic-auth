name: Tests

on:
  push:
    branches: ["3.x"]
  pull_request:

# Actions are pinned by commit (a tag can be moved); the token can only read.
permissions:
  contents: read

jobs:
  # PHP x Laravel x Twill. Twill 3.5 does not support Laravel 13, so that pair is left out: 3 pairs x 3 PHP versions, plus PHP 8.6 on Laravel 13 only.
  # PHP 8.6 is a nightly build of the PHP-8.6 branch (setup-php): it is experimental, and a failure there does not fail the workflow.
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Twill ${{ matrix.twill }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5", "8.6"]
        laravel: ["12", "13"]
        twill: ["3.5", "3.6"]
        include:
          # the Testbench that goes with each Laravel
          - laravel: "12"
            testbench: "^10.0"
          - laravel: "13"
            testbench: "^11.0"
        exclude:
          # Twill 3.5 does not support Laravel 13
          - laravel: "13"
            twill: "3.5"
          # Laravel 12 itself is not PHP 8.6 ready: Container uses spl_object_hash() (deprecated in 8.6) and
          # ArraySessionHandler lacks SessionHandlerInterface::create_sid(), so its own code throws. Laravel 13 is fine.
          - php: "8.6"
            laravel: "12"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Laravel, Testbench and Twill
        run: >
          composer require
          "laravel/framework:^${{ matrix.laravel }}.0"
          "orchestra/testbench:${{ matrix.testbench }}"
          "area17/twill:~${{ matrix.twill }}.0"
          --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-stable --no-interaction --no-progress --no-scripts

      - name: PHPUnit
        run: vendor/bin/phpunit

  # The oldest versions the package claims to support.
  lowest:
    name: Lowest dependencies (PHP 8.3)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress --no-scripts

      - name: PHPUnit
        run: vendor/bin/phpunit

  # Static analysis and formatting once, on the newest stable set: older PHPStan and laravel/ai typings give false positives.
  quality:
    name: Quality (PHPStan, PHP CS Fixer, Prettier)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: "8.4"
          coverage: none

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install PHP dependencies
        run: composer update --prefer-stable --no-interaction --no-progress --no-scripts

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP CS Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --config=.php-cs-fixer.dist.php --allow-risky=yes --no-interaction

      - name: Prettier
        run: npx prettier --check "src/**/*.php" "Tests/**/*.php"
