### General
plugins:
    - "@prettier/plugin-php"
    - "@shufo/prettier-plugin-blade"

arrowParens: always
tabWidth: 4
useTabs: false
requirePragma: false
insertPragma: false

### PHP
phpVersion: "8.3"
trailingCommaPHP: true
braceStyle: psr-2

### Pattern-specific
overrides:
    - files:
          - "src/**/*.php"
          - "Tests/**/*.php"
      options:
          singleQuote: true
          printWidth: 120
    - files: "src/**/*.blade.php"
      options:
          parser: "blade"
          printWidth: 120
